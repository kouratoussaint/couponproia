# Déploie le backend sur le projet Supabase défini dans app/env/prod.json :
# migrations SQL, Edge Functions, réglages Auth (codes à 6 chiffres), puis vérifie.
#
# Secrets GitHub requis :
#   SUPABASE_ACCESS_TOKEN  jeton personnel (supabase.com > Account > Access Tokens)
#   SUPABASE_DB_PASSWORD   mot de passe de la base choisi à la création du projet
#   API_FOOTBALL_KEY       clé API-Football (dashboard.api-football.com) ; sans elle, la
#                          synchronisation est journalisée « ignorée »
#   FCM_SERVICE_ACCOUNT : JSON du compte de service Firebase (Paramètres du projet → Comptes de
#     service → Générer une clé privée) ; sans lui, les notifications restent dans l'app.
#   CINETPAY_API_KEY, CINETPAY_SITE_ID, CINETPAY_SECRET_KEY : compte marchand CinetPay (menu
#                          Intégrations) ; sans eux, les achats sont indisponibles.
#   GEMINI_API_KEY         clé Google AI Studio (aistudio.google.com) pour l'analyse IA ;
#                          secours facultatifs : ANTHROPIC_API_KEY, GROQ_API_KEY. Sans clé,
#                          l'analyse se limite à la fiche statistique.
# Facultatifs (envoi d'emails via un SMTP, ex. Brevo) : SMTP_USER, SMTP_PASS,
#   SMTP_SENDER_EMAIL, et éventuellement SMTP_HOST / SMTP_PORT (défaut : Brevo, 587).
#   Sans eux, Supabase n'envoie qu'aux membres de l'équipe, 2 emails/heure, avec un
#   lien au lieu du code à 6 chiffres.
name: Déployer Supabase

on:
  workflow_dispatch:
    inputs:
      sync:
        description: 'Synchronisation à lancer après le déploiement (aucune, daily, odds, live)'
        required: false
        default: 'aucune'
  push:
    branches: [main]
    paths: ['supabase/migrations/**', 'supabase/functions/**', 'supabase/templates/**']

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Secrets présents
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Secrets GitHub manquants :$missing"
            exit 1
          fi

      - name: Identifiant du projet
        id: project
        run: |
          URL="$(jq -r .SUPABASE_URL app/env/prod.json)"
          REF="$(echo "$URL" | sed -E 's#^https://([a-z0-9]+)\.supabase\.co/?$#\1#')"
          if ! [[ "$REF" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::URL Supabase inattendue : $URL"; exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0  # épinglée : « latest » interroge l'API GitHub et peut échouer (limite de requêtes)

      - name: Lier le projet
        run: supabase link --project-ref "${{ steps.project.outputs.ref }}" --password "$SUPABASE_DB_PASSWORD"

      - name: Migrations
        run: |
          supabase migration list --password "$SUPABASE_DB_PASSWORD" || true
          supabase db push --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Secrets des fonctions et de la planification
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CINETPAY_API_KEY: ${{ secrets.CINETPAY_API_KEY }}
          CINETPAY_SITE_ID: ${{ secrets.CINETPAY_SITE_ID }}
          CINETPAY_SECRET_KEY: ${{ secrets.CINETPAY_SECRET_KEY }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          REF: ${{ steps.project.outputs.ref }}
        run: |
          export CRON_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$CRON_SECRET"
          echo "CRON_SECRET=$CRON_SECRET" >> "$GITHUB_ENV"
          args=("CRON_SECRET=$CRON_SECRET")
          if [ -n "$API_FOOTBALL_KEY" ]; then
            args+=("API_FOOTBALL_KEY=$API_FOOTBALL_KEY")
          else
            echo "::warning::Secret API_FOOTBALL_KEY absent : les synchronisations seront ignorées."
          fi
          ai_keys=0
          for k in GEMINI_API_KEY ANTHROPIC_API_KEY GROQ_API_KEY; do
            if [ -n "${!k}" ]; then args+=("$k=${!k}"); ai_keys=$((ai_keys + 1)); fi
          done
          for k in CINETPAY_API_KEY CINETPAY_SITE_ID CINETPAY_SECRET_KEY; do
            if [ -n "${!k}" ]; then args+=("$k=${!k}"); fi
          done
          if [ -z "$CINETPAY_API_KEY" ] || [ -z "$CINETPAY_SITE_ID" ]; then
            echo "::warning::CINETPAY_API_KEY / CINETPAY_SITE_ID absents : les achats répondront « paiement pas encore configuré »."
          fi
          # Compte de service Firebase (JSON) : compacté sur une ligne pour être transmis tel quel.
          if [ -n "$FCM_SERVICE_ACCOUNT" ]; then
            if fcm_json="$(printf '%s' "$FCM_SERVICE_ACCOUNT" | jq -c . 2>/dev/null)" && [ -n "$fcm_json" ]; then
              echo "::add-mask::$fcm_json"
              args+=("FCM_SERVICE_ACCOUNT=$fcm_json")
            else
              echo "::warning::FCM_SERVICE_ACCOUNT n'est pas un JSON valide : notifications limitées à la boîte de réception de l'app."
            fi
          else
            echo "::warning::FCM_SERVICE_ACCOUNT absent : notifications limitées à la boîte de réception de l'app."
          fi
          if [ "$ai_keys" -eq 0 ]; then
            echo "::warning::Aucune clé IA (GEMINI_API_KEY, ANTHROPIC_API_KEY, GROQ_API_KEY) : les analyses se limiteront à la fiche statistique."
          fi
          if ! supabase secrets set --project-ref "$REF" "${args[@]}" > secrets.log 2>&1; then
            echo "::error::supabase secrets set a échoué : $(tr '\n' ' ' < secrets.log | head -c 500)"
            exit 1
          fi
          # URL du projet et secret partagé dans Vault, lus par pg_cron (app_private.invoke_sports_sync)
          if ! python3 - <<'PY' > vault.json 2> vault_py.log
          import json, os
          url = f"https://{os.environ['REF']}.supabase.co"
          secret = os.environ["CRON_SECRET"]
          sql = f"""
          do $$
          begin
            perform vault.update_secret(id, '{url}') from vault.secrets where name = 'project_url';
            if not found then perform vault.create_secret('{url}', 'project_url'); end if;
            perform vault.update_secret(id, '{secret}') from vault.secrets where name = 'sports_cron_secret';
            if not found then perform vault.create_secret('{secret}', 'sports_cron_secret'); end if;
          end $$;
          """
          print(json.dumps({"query": sql}))
          PY
          then
            echo "::error::Préparation de la requête Vault impossible : $(head -c 300 vault_py.log)"; exit 1
          fi
          status="$(curl -s -o vault_response.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @vault.json || true)"
          rm -f vault.json
          if [ "${status:0:1}" != "2" ]; then
            echo "::error::Écriture Vault refusée (HTTP $status) : $(head -c 300 vault_response.json)"; exit 1
          fi
          echo "::notice::Secrets de planification enregistrés (Vault + fonction)"

      - name: Edge Functions
        run: |
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            [ "$name" = "_shared" ] && continue
            supabase functions deploy "$name" --project-ref "${{ steps.project.outputs.ref }}"
          done

      - name: Réglages Auth (confirmation par code)
        env:
          SUPABASE_REF: ${{ steps.project.outputs.ref }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SENDER_EMAIL: ${{ secrets.SMTP_SENDER_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: |
          python3 scripts/supabase/auth_config.py > auth.json 2> mode.txt
          status="$(curl -s -o response.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/${{ steps.project.outputs.ref }}/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @auth.json)"
          if [ "$status" != "200" ]; then
            echo "::error::Réglages Auth refusés (HTTP $status) : $(head -c 500 response.json)"
            exit 1
          fi
          if grep -q smtp mode.txt; then
            echo "::notice::Réglages Auth appliqués avec SMTP : emails en français avec code à 6 chiffres"
          else
            echo "::warning::Réglages Auth de base appliqués. Sans SMTP, Supabase envoie un lien (pas de code) et seulement aux membres de l'équipe."
          fi

      - name: Vérification avec la clé publique
        run: bash scripts/supabase/smoke_test.sh app/env/prod.json

      - name: Planification active
        env:
          REF: ${{ steps.project.outputs.ref }}
        run: |
          curl -s -o cron.json -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data '{"query": "select jobname, schedule, active from cron.job order by jobname"}'
          echo "::notice::Tâches planifiées : $(jq -c '[.[] | {jobname, schedule, active}]' cron.json 2>/dev/null || head -c 300 cron.json)"

      - name: Synchronisation initiale
        if: ${{ inputs.sync != '' && inputs.sync != 'aucune' }}
        env:
          JOB: ${{ inputs.sync }}
        run: |
          URL="$(jq -r .SUPABASE_URL app/env/prod.json)"
          sleep 5
          status="$(curl -s -o sync.json -w '%{http_code}' -X POST "$URL/functions/v1/sports-sync" \
            -H "Content-Type: application/json" -H "x-cron-secret: $CRON_SECRET" \
            --data "{\"job\": \"$JOB\"}")"
          echo "::notice::Synchronisation $JOB : HTTP $status $(head -c 300 sync.json)"
          [ "${status:0:1}" = "2" ]
