# Déploie le backend sur le projet Supabase défini dans app/env/prod.json :
# migrations SQL, Edge Functions, réglages Auth (codes à 6 chiffres), puis vérifie.
#
# Secrets GitHub requis :
#   SUPABASE_ACCESS_TOKEN  jeton personnel (supabase.com > Account > Access Tokens)
#   SUPABASE_DB_PASSWORD   mot de passe de la base choisi à la création du projet
name: Déployer Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', 'supabase/functions/**', 'supabase/templates/**']

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Secrets présents
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Secrets GitHub manquants :$missing"
            exit 1
          fi

      - name: Identifiant du projet
        id: project
        run: |
          URL="$(jq -r .SUPABASE_URL app/env/prod.json)"
          REF="$(echo "$URL" | sed -E 's#^https://([a-z0-9]+)\.supabase\.co/?$#\1#')"
          if ! [[ "$REF" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::URL Supabase inattendue : $URL"; exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Lier le projet
        run: supabase link --project-ref "${{ steps.project.outputs.ref }}" --password "$SUPABASE_DB_PASSWORD"

      - name: Migrations
        run: |
          supabase migration list --password "$SUPABASE_DB_PASSWORD" || true
          supabase db push --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Edge Functions
        run: |
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            [ "$name" = "_shared" ] && continue
            supabase functions deploy "$name" --project-ref "${{ steps.project.outputs.ref }}"
          done

      - name: Réglages Auth (confirmation par code)
        run: |
          python3 scripts/supabase/auth_config.py > auth.json
          status="$(curl -s -o response.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/${{ steps.project.outputs.ref }}/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @auth.json)"
          if [ "$status" != "200" ]; then
            echo "::error::Réglages Auth refusés (HTTP $status) : $(head -c 500 response.json)"
            exit 1
          fi
          echo "::notice::Réglages Auth appliqués (codes à 6 chiffres, confirmation obligatoire)"

      - name: Vérification avec la clé publique
        run: bash scripts/supabase/smoke_test.sh app/env/prod.json
