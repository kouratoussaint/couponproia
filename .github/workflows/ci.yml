name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: App Flutter (analyse + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test || echo "::warning::Formatage à revoir (dart format)"
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  web:
    name: Web (compilation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Préparation de la future interface web : le code doit continuer à compiler pour le navigateur.
      - run: flutter build web --release --dart-define-from-file=env/prod.json

  database:
    name: Base de données (migrations + tests RLS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Migrations et tests sur PostgreSQL 16
        run: bash scripts/local-db/test.sh

  edge-functions:
    name: Edge Functions (vérification TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts
      - name: Tests unitaires (normalisation, fournisseur)
        run: deno test supabase/functions/_shared/
