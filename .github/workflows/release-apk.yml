# Publie un APK signé à chaque tag de version : `git tag v0.1.0 && git push --tags`.
#
# Secrets GitHub requis (Settings > Secrets and variables > Actions) :
#   ANDROID_KEYSTORE_BASE64   keystore de signature encodé en base64
#   ANDROID_KEYSTORE_PASSWORD mot de passe du keystore
#   ANDROID_KEY_ALIAS         alias de la clé
#   ANDROID_KEY_PASSWORD      mot de passe de la clé
#   SUPABASE_URL / SUPABASE_ANON_KEY  (facultatifs : sans eux, l'APK affiche
#                                      l'écran « configuration manquante »)
name: Release APK

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF#refs/tags/v}"
          else
            NAME="$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')-dev"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # Numéro de build toujours croissant : condition pour installer les mises à jour.
          echo "build=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 absent : impossible de signer l'APK."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/upload-keystore.jks
          {
            echo "storeFile=../upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter test

      - name: Compiler les APK (un par architecture)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info=build/symbols \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.build }}" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=APP_ENV=prod

      - name: Renommer et calculer les empreintes
        run: |
          mkdir -p ../dist
          V="${{ steps.version.outputs.name }}"
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="$(basename "$f" | sed 's/app-//; s/-release.apk//')"
            cp "$f" "../dist/coupon-pro-ia-$V-$abi.apk"
          done
          (cd ../dist && sha256sum *.apk > SHA256SUMS.txt && ls -la)

      - name: Conserver les symboles (rapports de plantage)
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-${{ steps.version.outputs.name }}
          path: app/build/symbols
          retention-days: 90

      - name: Publier la release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **Quel APK installer ?** Presque tous les téléphones récents : `arm64-v8a`.
            Téléphones anciens ou très bon marché : `armeabi-v7a`.
            Build ${{ steps.version.outputs.build }}.

      - name: Artefact (lancement manuel)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.version.outputs.name }}
          path: dist/*
