name: Compilation iOS (sans signature)

# Préparation iOS : vérifie que l'app compile pour iPhone, sans certificat Apple.
# Lancement manuel uniquement (les machines macOS consomment 10 fois plus de minutes GitHub).
# Pour publier sur l'App Store : compte Apple Developer, certificats et profil de provisionnement,
# puis signature (voir docs/ios-web.md).
on:
  workflow_dispatch:

jobs:
  ios:
    name: iOS (Runner.app non signé)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compilation
        run: flutter build ios --release --no-codesign --dart-define-from-file=env/prod.json
      - name: Archive
        run: cd build/ios/iphoneos && zip -qr ../../../runner-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-runner-unsigned
          path: app/runner-unsigned.zip
          retention-days: 7
