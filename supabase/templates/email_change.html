<!-- Modèle « Change Email Address » : code envoyé à la nouvelle adresse -->
<div style="font-family: Arial, sans-serif; max-width: 480px; margin: auto; color: #0A1F1A;">
  <h2 style="color: #071B1B;">Nouvelle adresse e-mail</h2>
  <p>Voici votre code pour confirmer cette adresse sur Coupon Pro IA :</p>
  <p style="font-size: 32px; font-weight: bold; letter-spacing: 8px; color: #00A86B;">{{ .Token }}</p>
  <p>Saisissez-le dans l'application. Il expire dans une heure.</p>
  <p style="color: #82918A; font-size: 12px;">Si vous n'avez rien demandé, ignorez cet e-mail : votre adresse ne change pas.</p>
</div>
