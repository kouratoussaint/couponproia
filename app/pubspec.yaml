name: coupon_pro_ia
description: "Coupon Pro IA — l'intelligence au service de vos pronostics."
publish_to: 'none'

# version: <nom>+<numéro de build>. Le numéro de build est surchargé en CI
# (--build-number) et doit toujours augmenter pour que les mises à jour s'installent.
version: 0.35.0+1

environment:
  # Flutter >= 3.27 requis (CardThemeData, Color.withValues).
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^2.6.1
  go_router: '>=14.6.0 <18.0.0'
  shared_preferences: '>=2.3.0 <4.0.0'
  google_fonts: '>=6.2.1 <8.0.0'
  package_info_plus: '>=8.0.0 <11.0.0'
  url_launcher: '>=6.3.0 <8.0.0'
  cached_network_image: '>=3.4.0 <5.0.0'
  image_picker: ^1.2.4
  share_plus: ^13.3.1
  pdf: ^3.13.1
  image: ^4.12.0
  gal: ^2.3.3
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  http: ^1.1.0
  crypto: ^3.0.3
  path_provider: ^2.1.0
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=5.0.0 <8.0.0'
  flutter_launcher_icons: '>=0.14.1 <1.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/i18n/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#071B1B"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21
